apiVersion: v1
kind: ConfigMap
metadata:
  name: map-openresty-config
  namespace: bock
data:
  nginx.conf: |
    worker_processes  1;

    events {
        worker_connections  1024;
    }

    http {
        lua_shared_dict api_limit 10m;
        error_log /usr/local/openresty/nginx/logs/error.log info;

        server {
            listen 80;
            server_name localhost;

            location /api/health {
                access_by_lua_block {
                    ngx.status = 200
                    ngx.say('{"status":"ok","service":"openresty"}')
                    return ngx.exit(200)
                }
            }

            location /api/maps/styles/ {
                set $api_key $arg_key;

                if ($api_key = "") {
                    return 401 '{"error":"API key required"}';
                }

                access_by_lua_block {
                    if ngx.var.api_key == "myfirstkey" then
                        return
                    end

                    local redis = require "resty.redis"
                    local red = redis:new()
                    red:set_timeout(1000)

                    local ok, err = red:connect("localhost", 6379)
                    if not ok then
                        ngx.log(ngx.ERR, "Redis connection failed: ", err)
                        ngx.status = 403
                        ngx.say('{"error":"Invalid API key"}')
                        return ngx.exit(403)
                    end

                    local res, err = red:get("api_key:" .. ngx.var.api_key)
                    if err then
                        ngx.log(ngx.ERR, "Redis GET error: ", err)
                    end
                    if res == ngx.null then
                        ngx.status = 403
                        ngx.say('{"error":"Invalid API key"}')
                        return ngx.exit(403)
                    end

                    local _, incr_err = red:incr("usage:" .. ngx.var.api_key)
                    if incr_err then
                        ngx.log(ngx.ERR, "Redis INCR error: ", incr_err)
                    end
                }

                rewrite ^/api/maps/styles/(.*) /styles/$1 break;
                proxy_pass http://localhost:8084;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }
        }
    }
