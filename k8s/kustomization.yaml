# =============================================================================
# KUSTOMIZATION
# =============================================================================
# Usage:
#   kustomize build .                    # Build default (k8s postgres)
#   kustomize build . --enable-alpha-plugins -k overlays/rds  # Build for RDS/EKS
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bock

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - configmap.yaml
  - secret.yaml
  # ---------------------------------------------------------------------------
  # >>> TO USE AWS RDS: Comment out/remove these postgres resources below
  # ---------------------------------------------------------------------------
  - postgres-deployment.yaml
  - postgres-service.yaml
  - postgres-configmap.yaml
  - postgres-secret.yaml
  # - postgres-pv.yaml  # Optional: uncomment if you want a separate PV
