apiVersion: apps/v1
kind: Deployment
metadata:
  name: eira-backend
  namespace: bock
  labels:
    app: eira-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: eira-backend
  template:
    metadata:
      labels:
        app: eira-backend
    spec:
      containers:
        - name: eira-backend
          image: madhavkeshava/eira-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: eira-backend-config
            - secretRef:
                name: eira-backend-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
