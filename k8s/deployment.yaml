apiVersion: apps/v1
kind: Deployment
metadata:
  name: bockdrive-backend
  namespace: bock
  labels:
    app: bockdrive
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bockdrive
  template:
    metadata:
      labels:
        app: bockdrive
    spec:
      containers:
      - name: bockdrive-backend
        image: madhavkeshava/bockdrive-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
        envFrom:
        - secretRef:
            name: bockdrive-secrets
        startupProbe:
          httpGet:
            path: /api/drive/health
            port: 3001
          failureThreshold: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/drive/health
            port: 3001
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/drive/health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
