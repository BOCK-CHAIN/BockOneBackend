apiVersion: apps/v1
kind: Deployment
metadata:
  name: bocksheets-backend
  namespace: bock
  labels:
    app: bocksheets-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bocksheets-backend
  template:
    metadata:
      labels:
        app: bocksheets-backend
    spec:
      containers:
        - name: bocksheets-backend
          image: madhavkeshava/bocksheets-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: bocksheets-config
            - secretRef:
                name: bocksheets-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
