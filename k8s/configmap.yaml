apiVersion: v1
kind: ConfigMap
metadata:
  name: orventus-backend-config
  namespace: bock
data:
  # =============================================================================
  # ENVIRONMENT CONFIGURATION
  # =============================================================================
  NODE_ENV: "production"
  PORT: "3000"

  # =============================================================================
  # FRONTEND URLS - Update these when frontend URLs change
