  FRONTEND_URL_DEV: "http://localhost:65372"
  FRONTEND_URL_PROD: "https://orventus-472112.web.app"
  CORS_ORIGINS: "http://localhost:65372,http://localhost:3000,https://orventus-472112.web.app"
