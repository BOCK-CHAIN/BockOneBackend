apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ruviel-backend
  namespace: bock
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - host: ruviel-backend.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ruviel-backend
            port:
              number: 80
