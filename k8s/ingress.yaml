apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bocksheets-backend-ingress
  namespace: bock
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /api/bocksheets
            pathType: Prefix
            backend:
              service:
                name: bocksheets-backend-svc
                port:
                  number: 3000
