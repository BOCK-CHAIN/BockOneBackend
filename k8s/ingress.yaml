apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: eira-backend-ingress
  namespace: bock
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
    - http:
        paths:
          - path: /api/eira
            pathType: Prefix
            backend:
              service:
                name: eira-backend-svc
                port:
                  number: 8080
