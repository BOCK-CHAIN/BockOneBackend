apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bockdrive-ingress
  namespace: bock
spec:
  ingressClassName: nginx
  rules:
  - host: <elb-dns-url>
    http:
      paths:
      - path: /api/bockdrive
        pathType: Prefix
        backend:
          service:
            name: bockdrive-service
            port:
              number: 3001
