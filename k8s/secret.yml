apiVersion: v1
kind: Secret
metadata:
  name: bock-backend-secrets
  namespace: bock
  labels:
    app: bock-backend
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "your-aws-key"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret"
  DB_PASSWORD: "your-password"
  DATABASE_URL: "postgresql://bockone_user:your-password@your-db-host:5432/bockone_db?sslmode=require"
