apiVersion: v1
kind: Service
metadata:
  name: eira-backend-svc
  namespace: bock
  labels:
    app: eira-backend
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: eira-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
