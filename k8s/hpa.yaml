apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bocksheets-backend-hpa
  namespace: bock
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bocksheets-backend
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
