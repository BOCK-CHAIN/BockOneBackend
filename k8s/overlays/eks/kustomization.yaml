# =============================================================================
# EKS KUSTOMIZATION
# =============================================================================
# >>> For AWS EKS deployments
# >>> Combines RDS overlay with LoadBalancer service
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: bock

commonLabels:
  variant: eks

resources:
  - ../../overlays/rds

patchesStrategicMerge:
  - service.yaml
