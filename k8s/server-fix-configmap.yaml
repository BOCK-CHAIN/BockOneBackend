apiVersion: v1
kind: ConfigMap
metadata:
  name: golligog-server-fix
  namespace: bock
data:
  golligog-server.js: |
    const express = require('express');
    const cors = require('cors');
    const helmet = require('helmet');
    const rateLimit = require('express-rate-limit');
    const { PrismaClient } = require('@prisma/client');
    const bcrypt = require('bcryptjs');
    const jwt = require('jsonwebtoken');
    require('dotenv').config();

    const app = express();
    const prisma = new PrismaClient();

    app.use(helmet());
    app.use(cors({
        origin: '*',
        methods: ['GET', 'POST', 'PUT', 'DELETE', 'PATCH', 'OPTIONS'],
        allowedHeaders: ['Content-Type', 'Authorization']
    }));

    const limiter = rateLimit({
        windowMs: parseInt(process.env.RATE_LIMIT_WINDOW_MS) || 15 * 60 * 1000,
        max: parseInt(process.env.RATE_LIMIT_MAX_REQUESTS) || 100
    });
    app.use(limiter);

    app.use(express.json({ limit: '10mb' }));
    app.use(express.urlencoded({ extended: true }));

    const authenticateToken = (req, res, next) => {
        const authHeader = req.headers['authorization'];
        const token = authHeader && authHeader.split(' ')[1];
        if (!token) return res.status(401).json({ message: 'Access token required' });
        jwt.verify(token, process.env.JWT_SECRET, (err, user) => {
            if (err) return res.status(403).json({ message: 'Invalid or expired token' });
            req.user = user;
            next();
        });
    };

    app.get('/api/health', async (req, res) => {
        try {
            await prisma.$queryRaw`SELECT 1`;
            res.json({ status: 'healthy', database: 'connected', timestamp: new Date().toISOString() });
        } catch (error) {
            res.status(500).json({ status: 'unhealthy', database: 'disconnected', error: error.message, timestamp: new Date().toISOString() });
        }
    });

    app.get('/api/golligog/health', async (req, res) => {
        try {
            await prisma.$queryRaw`SELECT 1`;
            res.json({ status: 'healthy', database: 'connected', timestamp: new Date().toISOString() });
        } catch (error) {
            res.status(500).json({ status: 'unhealthy', database: 'disconnected', error: error.message, timestamp: new Date().toISOString() });
        }
    });

    app.post('/api/golligog/api/auth/register', async (req, res) => {
        try {
            const { email, password, name } = req.body;
            if (!email || !password) return res.status(400).json({ message: 'Email and password are required' });
            if (password.length < 6) return res.status(400).json({ message: 'Password must be at least 6 characters long' });
            const existingUser = await prisma.user.findUnique({ where: { email } });
            if (existingUser) return res.status(409).json({ message: 'User already exists with this email' });
            const saltRounds = parseInt(process.env.BCRYPT_SALT_ROUNDS) || 12;
            const hashedPassword = await bcrypt.hash(password, saltRounds);
            const user = await prisma.user.create({
                data: { email, password: hashedPassword, name: name || null },
                select: { id: true, email: true, name: true, createdAt: true }
            });
            const token = jwt.sign({ userId: user.id, email: user.email }, process.env.JWT_SECRET, { expiresIn: process.env.JWT_EXPIRE || '7d' });
            res.status(201).json({ message: 'User registered successfully', user, token });
        } catch (error) {
            console.error('Registration error:', error);
            res.status(500).json({ message: 'Internal server error during registration', error: process.env.NODE_ENV === 'development' ? error.message : undefined });
        }
    });

    app.post('/api/golligog/api/auth/login', async (req, res) => {
        try {
            const { email, password } = req.body;
            if (!email || !password) return res.status(400).json({ message: 'Email and password are required' });
            const user = await prisma.user.findUnique({ where: { email } });
            if (!user) return res.status(401).json({ message: 'Invalid credentials' });
            const isValidPassword = await bcrypt.compare(password, user.password);
            if (!isValidPassword) return res.status(401).json({ message: 'Invalid credentials' });
            const token = jwt.sign({ userId: user.id, email: user.email }, process.env.JWT_SECRET, { expiresIn: process.env.JWT_EXPIRE || '7d' });
            res.json({ message: 'Login successful', user: { id: user.id, email: user.email, name: user.name, createdAt: user.createdAt }, token });
        } catch (error) {
            console.error('Login error:', error);
            res.status(500).json({ message: 'Internal server error during login', error: process.env.NODE_ENV === 'development' ? error.message : undefined });
        }
    });

    app.get('/api/golligog/api/auth/profile', authenticateToken, async (req, res) => {
        try {
            const user = await prisma.user.findUnique({
                where: { id: req.user.userId },
                select: { id: true, email: true, name: true, createdAt: true, updatedAt: true }
            });
            if (!user) return res.status(404).json({ message: 'User not found' });
            res.json({ user });
        } catch (error) {
            console.error('Profile fetch error:', error);
            res.status(500).json({ message: 'Internal server error' });
        }
    });

    app.put('/api/golligog/api/auth/profile', authenticateToken, async (req, res) => {
        try {
            const { name, email } = req.body;
            const userId = req.user.userId;
            if (!name || !email) return res.status(400).json({ message: 'Name and email are required' });
            if (!email.includes('@')) return res.status(400).json({ message: 'Please provide a valid email address' });
            const existingUser = await prisma.user.findFirst({ where: { email, NOT: { id: userId } } });
            if (existingUser) return res.status(409).json({ message: 'Email is already taken by another user' });
            const updatedUser = await prisma.user.update({
                where: { id: userId },
                data: { name: name.trim(), email: email.trim(), updatedAt: new Date() },
                select: { id: true, email: true, name: true, createdAt: true, updatedAt: true }
            });
            res.json({ message: 'Profile updated successfully', user: updatedUser });
        } catch (error) {
            console.error('Profile update error:', error);
            res.status(500).json({ message: 'Internal server error while updating profile' });
        }
    });

    app.put('/api/golligog/api/auth/change-password', authenticateToken, async (req, res) => {
        try {
            const { currentPassword, newPassword } = req.body;
            const userId = req.user.userId;
            if (!currentPassword || !newPassword) return res.status(400).json({ message: 'Current password and new password are required' });
            if (newPassword.length < 6) return res.status(400).json({ message: 'New password must be at least 6 characters long' });
            const user = await prisma.user.findUnique({ where: { id: userId } });
            if (!user) return res.status(404).json({ message: 'User not found' });
            const isValidPassword = await bcrypt.compare(currentPassword, user.password);
            if (!isValidPassword) return res.status(401).json({ message: 'Current password is incorrect' });
            const saltRounds = parseInt(process.env.BCRYPT_SALT_ROUNDS) || 12;
            const hashedNewPassword = await bcrypt.hash(newPassword, saltRounds);
            await prisma.user.update({ where: { id: userId }, data: { password: hashedNewPassword, updatedAt: new Date() } });
            res.json({ message: 'Password changed successfully' });
        } catch (error) {
            console.error('Password change error:', error);
            res.status(500).json({ message: 'Internal server error while changing password' });
        }
    });

    app.post('/api/golligog/api/auth/logout', authenticateToken, (req, res) => {
        res.json({ message: 'Logout successful. Please remove the token from client-side storage.' });
    });

    app.post('/api/golligog/api/search/history', authenticateToken, async (req, res) => {
        try {
            const { query } = req.body;
            const userId = req.user.userId;
            if (!query || query.trim().length === 0) return res.status(400).json({ message: 'Search query is required' });
            const existingQuery = await prisma.searchHistory.findFirst({ where: { userId, query: query.trim() } });
            if (existingQuery) {
                const updatedHistory = await prisma.searchHistory.update({ where: { id: existingQuery.id }, data: { createdAt: new Date() } });
                return res.json({ message: 'Search query updated in history', searchHistory: updatedHistory });
            }
            const searchHistory = await prisma.searchHistory.create({ data: { query: query.trim(), userId } });
            res.status(201).json({ message: 'Search query saved to history', searchHistory });
        } catch (error) {
            console.error('Save search history error:', error);
            res.status(500).json({ message: 'Internal server error while saving search history', error: process.env.NODE_ENV === 'development' ? error.message : undefined });
        }
    });

    app.get('/api/golligog/api/search/history', authenticateToken, async (req, res) => {
        try {
            const userId = req.user.userId;
            const limit = parseInt(req.query.limit) || 20;
            const offset = parseInt(req.query.offset) || 0;
            const searchHistory = await prisma.searchHistory.findMany({
                where: { userId },
                orderBy: { createdAt: 'desc' },
                take: limit,
                skip: offset,
                select: { id: true, query: true, createdAt: true }
            });
            const totalCount = await prisma.searchHistory.count({ where: { userId } });
            res.json({ searchHistory, pagination: { total: totalCount, limit, offset, hasMore: offset + limit < totalCount } });
        } catch (error) {
            console.error('Get search history error:', error);
            res.status(500).json({ message: 'Internal server error while fetching search history', error: process.env.NODE_ENV === 'development' ? error.message : undefined });
        }
    });

    app.delete('/api/golligog/api/search/history/:id', authenticateToken, async (req, res) => {
        try {
            const { id } = req.params;
            const userId = req.user.userId;
            const searchItem = await prisma.searchHistory.findFirst({ where: { id, userId } });
            if (!searchItem) return res.status(404).json({ message: 'Search history item not found' });
            await prisma.searchHistory.delete({ where: { id } });
            res.json({ message: 'Search history item deleted successfully' });
        } catch (error) {
            console.error('Delete search history error:', error);
            res.status(500).json({ message: 'Internal server error while deleting search history', error: process.env.NODE_ENV === 'development' ? error.message : undefined });
        }
    });

    app.delete('/api/golligog/api/search/history', authenticateToken, async (req, res) => {
        try {
            const userId = req.user.userId;
            const result = await prisma.searchHistory.deleteMany({ where: { userId } });
            res.json({ message: 'All search history cleared successfully', deletedCount: result.count });
        } catch (error) {
            console.error('Clear search history error:', error);
            res.status(500).json({ message: 'Internal server error while clearing search history', error: process.env.NODE_ENV === 'development' ? error.message : undefined });
        }
    });

    const https = require('https');
    const http = require('http');

    app.get('/api/golligog/api/search', async (req, res) => {
        const searxngBase = (process.env.SEARXNG_URL || '').replace(/\/+$/, '');
        if (!searxngBase) return res.status(503).json({ message: 'Search service not configured (SEARXNG_URL missing)' });
        const allowedParams = ['q', 'category', 'format', 'language', 'pageno', 'engines', 'lang'];
        const qs = new URLSearchParams();
        allowedParams.forEach(p => { if (req.query[p]) qs.set(p, req.query[p]); });
        if (!qs.has('format')) qs.set('format', 'json');
        const targetUrl = `${searxngBase}/search?${qs.toString()}`;
        console.log(`Proxying search to: ${targetUrl}`);
        try {
            const lib = targetUrl.startsWith('https') ? https : http;
            const proxyReq = lib.get(targetUrl, {
                headers: { 'Accept': 'application/json', 'User-Agent': 'Golligog-Backend/1.0' },
            }, (proxyRes) => {
                res.setHeader('Content-Type', proxyRes.headers['content-type'] || 'application/json');
                res.setHeader('Access-Control-Allow-Origin', '*');
                res.status(proxyRes.statusCode);
                proxyRes.pipe(res);
            });
            proxyReq.on('error', (e) => {
                console.error('Search proxy error:', e.message);
                res.status(502).json({ message: 'Search service unavailable', error: e.message });
            });
            proxyReq.setTimeout(15000, () => {
                proxyReq.destroy();
                res.status(504).json({ message: 'Search service timeout' });
            });
        } catch (e) {
            console.error('Search proxy exception:', e);
            res.status(500).json({ message: 'Search proxy error', error: e.message });
        }
    });

    app.use((err, req, res, next) => {
        console.error('Unhandled error:', err);
        res.status(500).json({ message: 'Something went wrong!', error: process.env.NODE_ENV === 'development' ? err.message : undefined });
    });

    app.use((req, res) => {
        res.status(404).json({ message: 'Route not found' });
    });

    process.on('SIGINT', async () => {
        console.log('Received SIGINT. Graceful shutdown...');
        await prisma.$disconnect();
        process.exit(0);
    });

    process.on('SIGTERM', async () => {
        console.log('Received SIGTERM. Graceful shutdown...');
        await prisma.$disconnect();
        process.exit(0);
    });

    const PORT = process.env.PORT || 5000;

    const startServer = async () => {
        try {
            await prisma.$connect();
            console.log('Database connected successfully');
            app.listen(PORT, () => {
                console.log(`Server is running on port ${PORT}`);
                console.log(`Health check: http://localhost:${PORT}/api/golligog/health`);
                console.log(`Auth endpoints:`);
                console.log(`   POST http://localhost:${PORT}/api/golligog/api/auth/register`);
                console.log(`   POST http://localhost:${PORT}/api/golligog/api/auth/login`);
                console.log(`   GET  http://localhost:${PORT}/api/golligog/api/auth/profile`);
            });
        } catch (error) {
            console.error('Failed to start server:', error);
            process.exit(1);
        }
    };

    startServer();
