version: '3.8'

services:
  eira-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eira-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "healthcheck.js"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
