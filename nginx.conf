server {
    listen 80;
    server_name 3.7.68.63;  # Replace with your domain when available
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    
    # Increase client body size for file uploads
    client_max_body_size 50M;
    
    # API proxy - routes /api/* to backend on port 3000
    location /api/ {
        # Remove /api prefix before forwarding to backend
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        
        # WebSocket support (for future real-time features)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        proxy_cache_bypass $http_upgrade;
    }
    
    # Health check endpoint (direct access without /api prefix)
    location /health {
        proxy_pass http://localhost:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;  # Don't log health checks
    }
    
    # Root location - can serve a simple info page
    location / {
        return 200 'BockSheets API Server\nAPI endpoints available at /api/*\nHealth check: /health\n';
        add_header Content-Type text/plain;
    }
}
