worker_processes  1;

events {
    worker_connections  1024;
}

http {
    lua_shared_dict api_limit 10m;
    error_log /usr/local/openresty/nginx/logs/error.log info;

    server {
        listen 80;
        server_name localhost;

        location /styles/ {
            # Extract API key from query param ?key=APIKEY
            set $api_key $arg_key;

            if ($api_key = "") {
                return 401 '{"error":"API key required"}';
            }

            access_by_lua_block {
                -- Fast-path for local dev: allow the default key without Redis dependency.
                if ngx.var.api_key == "myfirstkey" then
                    return
                end

                local redis = require "resty.redis"
                local red = redis:new()
                red:set_timeout(1000)

                -- Use the Redis container hostname on the same Docker network
                local ok, err = red:connect("map-redis", 6379)
                if not ok then
                    ngx.log(ngx.ERR, "Redis connection failed: ", err)
                    ngx.status = 403
                    ngx.say('{"error":"Invalid API key"}')
                    return ngx.exit(403)
                end

                local res, err = red:get("api_key:" .. ngx.var.api_key)
                if err then
                    ngx.log(ngx.ERR, "Redis GET error: ", err)
                end
                if res == ngx.null then
                    ngx.status = 403
                    ngx.say('{"error":"Invalid API key"}')
                    return ngx.exit(403)
                     end

                -- Increment usage
                local _, incr_err = red:incr("usage:" .. ngx.var.api_key)
                if incr_err then
                    ngx.log(ngx.ERR, "Redis INCR error: ", incr_err)
                end
            }

            # Forward via host-published tileserver port to avoid Docker DNS issues.
            # Keep this aligned with openmaptiles/.env -> TPORT.
            proxy_pass http://host.docker.internal:8084;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
