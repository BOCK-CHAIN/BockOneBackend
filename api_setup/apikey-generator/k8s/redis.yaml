apiVersion: apps/v1
kind: Deployment
metadata:
  name: map-redis
  namespace: demo
  labels:
    app: map-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: map-redis
  template:
    metadata:
      labels:
        app: map-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: map-redis
  namespace: demo
  labels:
    app: map-redis
spec:
  type: ClusterIP
  selector:
    app: map-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
