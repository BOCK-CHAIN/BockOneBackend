apiVersion: apps/v1
kind: Deployment
metadata:
  name: osrm-service
  namespace: bock
  labels:
    app: osrm-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: osrm-service
  template:
    metadata:
      labels:
        app: osrm-service
    spec:
      containers:
        - name: osrm
          image: osrm/osrm-backend:v5.25.0
          command:
            - osrm-routed
            - --algorithm
            - mld
            - /data/bengaluru.osrm
            - --port
            - "5000"
          ports:
            - containerPort: 5000
              name: http
          volumeMounts:
            - name: osrm-data
              mountPath: /data
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: osrm-data
          persistentVolumeClaim:
            claimName: osrm-data-pvc
