apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: bockmaps-mapserver-hpa
  namespace: demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: bockmaps-mapserver
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
