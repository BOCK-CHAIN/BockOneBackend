apiVersion: v1
kind: ConfigMap
metadata:
  name: bockmaps-mapserver-config
  namespace: bock
data:
  NODE_ENV: production
  PORT: "3001"
  DB_PORT: "5432"
  PGSSLROOTCERT: /certs/global-bundle.pem
  NODE_EXTRA_CA_CERTS: /certs/global-bundle.pem
  CORS_ORIGINS: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001,http://192.168.49.2:30191"
  OSRM_HOST: "osrm-service"
  OSRM_PORT: "5000"
  OSRM_TIMEOUT: "20000"
  OSRM_RETRIES: "3"
