apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bock
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
configMapGenerator:
  - name: aws-rds-ca-bundle
    files:
      - global-bundle.pem=global-bundle.pem
generatorOptions:
  disableNameSuffixHash: true
